# Render Blueprint for the REAL deployment (not the free demo in render.yaml).
# Render only reads render.yaml automatically; to use this one choose
# New -> Blueprint, pick this repo and set the Blueprint file path to render.production.yaml.
#
# Three paid pieces: a web service and a background worker on the Starter plan
# (0.5 CPU / 512 MB) and the smallest paid Postgres. Free instances cannot run a worker,
# free web services sleep, and free Postgres expires. Paid Postgres includes
# point-in-time recovery. Check render.com/pricing for current prices.
#
# Secrets live on the web service. The worker reads SECRET_KEY, APP_BASE_URL and the SMTP
# addresses from it; the four secrets that arrive later (Google token, SMTP password,
# Facebook token, Anthropic key) are pasted on both services' Environment tabs.

databases:
  - name: review-manager-db
    plan: basic-256mb            # smallest paid Postgres (legacy name, still accepted)
    region: ohio
    postgresMajorVersion: "16"

envVarGroups:
  # Shared settings that are not secrets (an environment group cannot hold secrets).
  - name: review-manager-settings
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TIMEZONE
        value: America/Chicago
      - key: LISTING_EXCLUDE_PATTERNS
        value: "wash n' roll,wash n roll,wash n’ roll"
      - key: SYNC_INTERVAL_MINUTES
        value: "20"
      - key: REPORT_HOUR_LOCAL
        value: "7"
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SSO_ALLOWED_DOMAINS
        value: washucarwash.com,washassociates.com,iconcarwash.com
      - key: PASSWORD_LOGIN_ENABLED
        value: "true"

services:
  - type: web
    name: review-manager
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh          # runs init-db (schema + safety checks), then the app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: review-manager-settings
      - key: DATABASE_URL
        fromDatabase:
          name: review-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # --- entered in the dashboard (blank is fine until you have it) ---
      - key: APP_BASE_URL            # e.g. https://review-manager.onrender.com, later your own domain
        sync: false
      - key: GOOGLE_TOKEN_JSON       # contents of google_token.json after `python cli.py google-auth`
        sync: false
      - key: SMTP_USER               # reviews@washassociates.com
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: SSO_ALLOWED_TENANTS
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: review-manager-worker
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python cli.py init-db && python cli.py worker
    autoDeploy: true
    envVars:
      - fromGroup: review-manager-settings
      - key: DATABASE_URL
        fromDatabase:
          name: review-manager-db
          property: connectionString
      # Read from the web service. Only values that always exist there can be referenced:
      # Render does not create a `sync: false` variable that was left blank, and a reference
      # to a missing variable fails the whole sync.
      - key: SECRET_KEY
        fromService: {type: web, name: review-manager, envVarKey: SECRET_KEY}
      - key: APP_BASE_URL
        fromService: {type: web, name: review-manager, envVarKey: APP_BASE_URL}
      - key: SMTP_USER
        fromService: {type: web, name: review-manager, envVarKey: SMTP_USER}
      - key: SMTP_FROM
        fromService: {type: web, name: review-manager, envVarKey: SMTP_FROM}
      # Secrets the worker needs too. Paste each on BOTH services when it arrives
      # (web: Environment tab; worker: Environment tab).
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
